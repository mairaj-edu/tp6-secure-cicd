name: Secure CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Build image
        run: docker build -t tp6-web:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: tp6-web:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
      - name: Helm lint
        run: helm lint ./charts/web
      - name: Render Kubernetes manifests
        run: |
          helm template web ./charts/web --namespace tp6 > rendered.yaml
          cat deployer-rbac.yaml >> rendered.yaml
      - name: Scan Kubernetes manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: rendered.yaml
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"

