apiVersion: apps/v1
kind: Deployment
metadata:
   name: web
spec:
   replicas: {{ .Values.replicaCount }}
   selector:
     matchLabels:
       app: web
   template:
     metadata:
       labels:
         app: web
     spec:
       serviceAccountName: web
       volumes:
        - name: tmp
          emptyDir: {}

       automountServiceAccountToken: false
       securityContext:
         runAsNonRoot: true
         runAsUser: 101
         seccompProfile:
           type: RuntimeDefault
       containers:
         - name: web
           image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
           imagePullPolicy: {{ .Values.image.pullPolicy }}
           ports:
             - name: http
               containerPort: 8080
           volumeMounts:
              - name: tmp
                mountPath: /tmp

           securityContext:
             allowPrivilegeEscalation: false
             readOnlyRootFilesystem: true
             runAsNonRoot: true
             runAsUser: 101
             runAsGroup: 101
             seccompProfile:
               type: RuntimeDefault

             capabilities:
               drop: ["ALL"]
           resources:
             requests:
               cpu: {{ .Values.resources.requests.cpu | quote }}
               memory: {{ .Values.resources.requests.memory | quote }}
             limits:
               cpu: {{ .Values.resources.limits.cpu | quote }}
               memory: {{ .Values.resources.limits.memory | quote }}
           readinessProbe:
             httpGet:
               path: /
               port: http
             initialDelaySeconds: 3
             periodSeconds: 5
           livenessProbe:
             httpGet:
               path: /
               port: http
             initialDelaySeconds: 10
             periodSeconds: 10
