apiVersion: v1
kind: ServiceAccount
metadata:
  name: tp-deployer
  namespace: tp6

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tp-deployer
  namespace: tp6
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tp-deployer
  namespace: tp6
subjects:
  - kind: ServiceAccount
    name: tp-deployer
    namespace: tp6
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tp-deployer

